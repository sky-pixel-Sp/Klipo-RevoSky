name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klipo-RevoSky-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

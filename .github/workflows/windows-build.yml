name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Install and smoke-test packaged Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $installDir = Join-Path $env:RUNNER_TEMP "Klipo RevoSky Smoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }
          $appExe = Join-Path $installDir "Klipo RevoSky.exe"
          if (-not (Test-Path $appExe)) { throw "Installed application executable was not found at $appExe." }
          $stdout = Join-Path $env:RUNNER_TEMP "klipo-smoke.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "klipo-smoke.stderr.log"
          $app = Start-Process -FilePath $appExe -ArgumentList @("--klipo-smoke-test") -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (Test-Path $stdout) { Get-Content $stdout }
          if (Test-Path $stderr) { Get-Content $stderr }
          if ($app.ExitCode -ne 0) { throw "Installed app smoke test failed with exit code $($app.ExitCode)." }
          if (-not ((Get-Content $stdout -Raw) -match "KLIPO_INSTALLED_SMOKE_RESULT=.*passed")) { throw "Installed app did not report a successful smoke test." }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klipo-RevoSky-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14

name: Windows build

on:
  push:
    branches: [main, "rebuild/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        run: npm run dist:win
      - name: Install and smoke-test packaged Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem "release" -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not produced." }
          $installDir = Join-Path $env:RUNNER_TEMP "KlipoRevoSkySmoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Silent installer failed with exit code $($install.ExitCode)." }
          $appExe = Join-Path $installDir "Klipo RevoSky.exe"
          if (-not (Test-Path $appExe)) { throw "Installed application executable was not found at $appExe." }
          $resultFile = Join-Path $env:RUNNER_TEMP "klipo-installed-smoke-result.json"
          $stdoutFile = Join-Path $env:RUNNER_TEMP "klipo-installed-smoke.stdout.log"
          $stderrFile = Join-Path $env:RUNNER_TEMP "klipo-installed-smoke.stderr.log"
          Remove-Item $resultFile, "$resultFile.started", $stdoutFile, $stderrFile -Force -ErrorAction SilentlyContinue
          $env:KLIPO_SMOKE_TEST = "1"
          $env:KLIPO_SMOKE_RESULT_PATH = $resultFile
          $smokeArgs = "--klipo-smoke-test --klipo-smoke-result=$resultFile"
          $appProcess = Start-Process -FilePath $appExe -ArgumentList $smokeArgs -PassThru -RedirectStandardOutput $stdoutFile -RedirectStandardError $stderrFile
          if (-not $appProcess.WaitForExit(180000)) {
            Stop-Process -Id $appProcess.Id -Force -ErrorAction SilentlyContinue
            throw "Installed app smoke test exceeded 180 seconds."
          }
          $appProcess.Refresh()
          $appExitCode = $appProcess.ExitCode
          if (-not (Test-Path $resultFile)) {
            $startedFile = "$resultFile.started"
            $diagnostic = if (Test-Path $startedFile) { Get-Content $startedFile -Raw } else { "No main-process startup marker was written." }
            $stdout = if (Test-Path $stdoutFile) { Get-Content $stdoutFile -Raw } else { "(no stdout)" }
            $stderr = if (Test-Path $stderrFile) { Get-Content $stderrFile -Raw } else { "(no stderr)" }
            throw "Installed app did not write its smoke-test result file. Exit code: $appExitCode. Startup: $diagnostic. STDOUT: $stdout. STDERR: $stderr"
          }
          $smoke = Get-Content $resultFile -Raw | ConvertFrom-Json
          if ($appExitCode -ne 0 -or $smoke.status -ne "passed" -or -not $smoke.ffmpegAvailable -or -not $smoke.ffprobeAvailable -or -not $smoke.ui.secureBridge -or -not $smoke.hasAudio -or -not $smoke.downloaderAvailable) {
            throw "Installed app smoke test failed (exit $appExitCode): $(Get-Content $resultFile -Raw)"
          }
          Get-Content $resultFile
          $uninstaller = Join-Path $installDir "Uninstall Klipo RevoSky.exe"
          if (Test-Path $uninstaller) {
            $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/S") -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw "Silent uninstaller failed with exit code $($uninstall.ExitCode)." }
          }
          if (Test-Path $appExe) { throw "Application files remained after silent uninstall." }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Klipo-RevoSky-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
